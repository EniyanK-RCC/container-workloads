apiVersion: v1
kind: ConfigMap
metadata:
  name: text-editor-dashboard
  namespace: text-editor-app
  labels:
    grafana_dashboard: "1"
    app: text-editor
data:
  dashboard.json: |
      {
        "title": "Text-Editor - Application Metrics",
        "tags": ["text-editor", "dev_team"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{job=\"text-editor\", namespace=\"text-editor-app\"}[5m])) by (status)",
                "legendFormat": "Status: {{status}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Error Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{job=\"text-editor\", namespace=\"text-editor-app\", status=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"text-editor\", namespace=\"text-editor-app\"}[5m]))",
                "legendFormat": "Error Rate"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Response Time (p95)",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"text-editor\", namespace=\"text-editor-app\"}[5m])) by (le))",
                "legendFormat": "p95 Latency"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Pod Count",
            "type": "stat",
            "targets": [
              {
                "expr": "count(up{job=\"text-editor\", namespace=\"text-editor-app\"})",
                "legendFormat": "Running Pods"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          }
        ]
      }
