apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: default-platform-alerts
  namespace: text-editor-app
  labels:
    managed-by: monitoring-automation
    alert-type: platform-default
    team: text-editor-team
spec:
  groups:
  - name: platform.default.rules
    interval: 30s
    rules:
    # Pod crash looping alert
    - alert: PodCrashLooping
      expr: |
        rate(kube_pod_container_status_restarts_total{namespace="text-editor-app"}[5m]) * 60 * 5 > 0
      for: 5m
      labels:
        severity: warning
        namespace: "text-editor-app"
      annotations:
        summary: "Pod is crash looping"
        description: "Pod {{ $labels.pod }} in namespace text-editor-app is restarting frequently"
    
    # Pod not ready alert
    - alert: PodNotReady
      expr: |
        kube_pod_status_ready{condition="false", namespace="text-editor-app"} == 1
      for: 10m
      labels:
        severity: warning
        namespace: "text-editor-app"
      annotations:
        summary: "Pod not ready"
        description: "Pod {{ $labels.pod }} in namespace text-editor-app has been not ready for more than 10 minutes"
    
    # High CPU usage alert
    - alert: HighCPUUsage
      expr: |
        sum(rate(container_cpu_usage_seconds_total{namespace="text-editor-app", container!="POD"}[5m])) by (pod) 
        / 
        sum(container_spec_cpu_quota{namespace="text-editor-app", container!="POD"} / container_spec_cpu_period{namespace="text-editor-app", container!="POD"}) by (pod) 
        > 0.8
      for: 15m
      labels:
        severity: warning
        namespace: "text-editor-app"
      annotations:
        summary: "High CPU usage detected"
        description: "Pod {{ $labels.pod }} in namespace text-editor-app is using {{ $value | humanizePercentage }} of CPU"
    
    # High memory usage alert
    - alert: HighMemoryUsage
      expr: |
        sum(container_memory_working_set_bytes{namespace="text-editor-app", container!="POD"}) by (pod) 
        / 
        sum(container_spec_memory_limit_bytes{namespace="text-editor-app", container!="POD"}) by (pod) 
        > 0.85
      for: 10m
      labels:
        severity: warning
        namespace: "text-editor-app"
      annotations:
        summary: "High memory usage detected"
        description: "Pod {{ $labels.pod }} in namespace text-editor-app is using {{ $value | humanizePercentage }} of memory"
    
    # High HTTP error rate alert
    - alert: HighHTTPErrorRate
      expr: |
        sum(rate(http_requests_total{namespace="text-editor-app", status=~"5.."}[5m])) 
        / 
        sum(rate(http_requests_total{namespace="text-editor-app"}[5m])) 
        > 0.05
      for: 5m
      labels:
        severity: warning
        namespace: "text-editor-app"
      annotations:
        summary: "High HTTP error rate detected"
        description: "HTTP error rate is {{ $value | humanizePercentage }} in namespace text-editor-app"
    
    # High latency alert
    - alert: HighLatency
      expr: |
        histogram_quantile(0.95, 
          sum(rate(http_request_duration_seconds_bucket{namespace="text-editor-app"}[5m])) by (le)
        ) > 2.0
      for: 10m
      labels:
        severity: warning
        namespace: "text-editor-app"
      annotations:
        summary: "High latency detected"
        description: "95th percentile latency is {{ $value }}s in namespace text-editor-app"